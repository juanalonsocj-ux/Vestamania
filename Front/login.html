
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Iniciar sesión | Vestamania</title>

    <!-- Bootstrap 5 -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <!-- Iconos de Bootstrap -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
        rel="stylesheet">

    <!-- Nuestro CSS -->
    <link rel="stylesheet" href="../css/style.css">
</head>

<body class="login-page">

    <!-- Barra de navegación -->
    <nav class="navbar bg-white border-bottom">
        <div class="container py-2">

            <a href="index.html"
               class="navbar-brand d-flex align-items-center gap-2">

                <span class="logo-icon">
                    <i class="bi bi-layers"></i>
                </span>

                <span class="fw-bold">VESTAMANIA</span>
            </a>

            <a href="index.html"
               class="text-decoration-none text-secondary">
                <i class="bi bi-arrow-left"></i>
                Volver al inicio
            </a>

        </div>
    </nav>

    <!-- Contenido -->
    <main class="container">

        <div class="row justify-content-center align-items-center login-content">

            <div class="col-12 col-md-8 col-lg-5">

                <div class="card login-card shadow-sm">

                    <div class="card-body p-4 p-md-5">

                        <h1 class="h3 text-center fw-bold mb-2">
                            Iniciar sesión
                        </h1>

                        <p class="text-center text-secondary mb-4">
                            Introduce tus datos para acceder
                        </p>

                        <form id="loginForm">

                            <!-- Correo -->
                            <div class="mb-3">

                                <label for="email" class="form-label">
                                    Correo electrónico
                                </label>

                                <input
                                    type="email"
                                    class="form-control"
                                    id="email"
                                    name="email"
                                    placeholder="nombre@empresa.com"
                                    autocomplete="username"
                                    required>

                            </div>

                            <!-- Contraseña -->
                            <div class="mb-4">

                                <label for="password" class="form-label">
                                    Contraseña
                                </label>

                                <div class="input-group">

                                    <input
                                        type="password"
                                        class="form-control"
                                        id="password"
                                        name="password"
                                        placeholder="Introduce tu contraseña"
                                        autocomplete="current-password"
                                        required>

                                    <button
                                        class="btn btn-outline-secondary"
                                        type="button"
                                        id="togglePassword"
                                        aria-label="Mostrar contraseña"
                                        aria-pressed="false">

                                        <i class="bi bi-eye"></i>

                                    </button>

                                </div>

                            </div>

                            <!-- Enviar -->
                            <button
                                type="submit"
                                class="btn btn-vestamania w-100">

                                Entrar a Vestamania

                            </button>

                            <p class="text-center text-secondary small mt-4 mb-0">
                                Acceso para administradores y empleados
                            </p>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </main>

    <!-- JavaScript de Bootstrap -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Nuestro JavaScript -->
    <script src="../js/main.js"></script>

</body>
</html>
